syntax = "proto3";

package staticanalysis.v1;

import "google/api/annotations.proto";

option go_package = "github.com/toheart/goanalysis/api/staticanalysis/v1;v1";

// 静态分析服务定义
service StaticAnalysis {
  // 获取静态分析数据库文件列表
  rpc GetStaticDbFiles(GetStaticDbFilesRequest) returns (GetStaticDbFilesResponse) {
    option (google.api.http) = {
      get: "/api/static/dbfiles"
    };
  }

  // 获取分析任务状态
  rpc GetAnalysisTaskStatus(GetAnalysisTaskStatusRequest) returns (GetAnalysisTaskStatusResponse) {
    option (google.api.http) = {
      get: "/api/static/task/{task_id}/status"
    };
  }

  // 分析项目路径
  rpc AnalyzeProjectPath(AnalyzeProjectPathRequest) returns (AnalyzeProjectPathResponse) {
    option (google.api.http) = {
      post: "/api/static/analyze/path"
      body: "*"
    };
  }
  
  // 分析数据库文件
  rpc AnalyzeDbFile(AnalyzeDbFileRequest) returns (AnalyzeDbFileResponse) {
    option (google.api.http) = {
      post: "/api/static/analyze"
      body: "*"
    };
  }


  // 模糊搜索函数
  rpc SearchFunctions(SearchFunctionsRequest) returns (SearchFunctionsResponse) {
    option (google.api.http) = {
      post: "/api/static/search-functions"
      body: "*"
    };
  }

  // ================ 可视化分析接口 ================

  // 获取全局统计信息
  rpc GetGlobalStatistics(GetGlobalStatisticsRequest) returns (GetGlobalStatisticsResponse) {
    option (google.api.http) = {
      get: "/api/static/viz/statistics"
    };
  }

  // 获取调用图数据
  rpc GetCallGraph(GetCallGraphRequest) returns (GetCallGraphResponse) {
    option (google.api.http) = {
      post: "/api/static/viz/callgraph"
      body: "*"
    };
  }

  // 获取包依赖关系
  rpc GetPackageDependencies(GetPackageDependenciesRequest) returns (GetPackageDependenciesResponse) {
    option (google.api.http) = {
      get: "/api/static/viz/packages"
    };
  }

  // 获取热点函数分析
  rpc GetHotFunctions(GetHotFunctionsRequest) returns (GetHotFunctionsResponse) {
    option (google.api.http) = {
      get: "/api/static/viz/hotfunctions"
    };
  }

  // 获取函数详细信息
  rpc GetFunctionDetails(GetFunctionDetailsRequest) returns (GetFunctionDetailsResponse) {
    option (google.api.http) = {
      get: "/api/static/viz/function/{function_key}"
    };
  }

  // 获取函数调用路径
  rpc GetFunctionCallPaths(GetFunctionCallPathsRequest) returns (GetFunctionCallPathsResponse) {
    option (google.api.http) = {
      post: "/api/static/viz/callpaths"
      body: "*"
    };
  }

  // 获取Init函数列表
  rpc GetInitFunctions(GetInitFunctionsRequest) returns (GetInitFunctionsResponse) {
    option (google.api.http) = {
      get: "/api/static/viz/initfunctions"
    };
  }
}

// 获取静态分析数据库文件列表请求
message GetStaticDbFilesRequest {
}

// 静态分析数据库文件信息
message DbFileInfo {
  string path = 1;
  string name = 2;
  int64 size = 3;
  string create_time = 4;
}

// 获取静态分析数据库文件列表响应
message GetStaticDbFilesResponse {
  repeated DbFileInfo files = 1;
}

// 分析项目路径请求
message AnalyzeProjectPathRequest {
  string path = 1;
  string algo = 2;         // 分析算法: "vta", "rta", "cha", "static"
  string ignore_method = 3;  // 忽略分析特定方法
}

// 分析项目路径响应
message AnalyzeProjectPathResponse {
  bool success = 1;
  string message = 2;
  string task_id = 3;
}

// 获取分析任务状态请求
message GetAnalysisTaskStatusRequest {
  string task_id = 1;
}

// 获取分析任务状态响应
message GetAnalysisTaskStatusResponse {
  int32 status = 1;   // 状态：0: starting, 1: processing, 2: completed, -1: failed, -2: not_found
  string message = 2;  // 消息
  float progress = 3;  // 进度百分比 (0-100)
}

// 分析数据库文件请求
message AnalyzeDbFileRequest {
  string db_path = 1;
}


// 分析数据库文件响应
message AnalyzeDbFileResponse {
  int32 total_functions = 1;
  int32 total_calls = 2;
  int32 total_packages = 3;
}



// 函数信息
message FunctionInfo {
  string key = 1;         // 函数唯一标识
  string name = 2;        // 函数名称
  string package = 3;     // 包名
  int32 call_count = 4;   // 调用次数
}

// 模糊搜索函数请求
message SearchFunctionsRequest {
  string query = 1;       // 搜索关键词
}

// 模糊搜索函数响应
message SearchFunctionsResponse {
  repeated FunctionInfo functions = 1; // 匹配的函数列表
}

// ================ 可视化分析相关消息定义 ================

// 获取全局统计信息请求
message GetGlobalStatisticsRequest {
}

// 全局统计信息响应
message GetGlobalStatisticsResponse {
  int32 total_functions = 1;
  int32 total_packages = 2;
  int32 total_edges = 3;
  float avg_call_depth = 4;
  int32 max_call_depth = 5;
  repeated HotFunction hot_functions = 6;
  repeated PackageStatistic package_stats = 7;
}

// 热点函数信息
message HotFunction {
  string key = 1;
  string name = 2;
  string package = 3;
  int32 caller_count = 4;    // 被调用次数
  int32 callee_count = 5;    // 调用其他函数次数
  float importance_score = 6; // 重要性评分
}

// 包统计信息
message PackageStatistic {
  string package_name = 1;
  int32 function_count = 2;
  int32 internal_calls = 3;   // 包内调用
  int32 external_calls = 4;   // 跨包调用
  float complexity_score = 5; // 复杂度评分
}

// 获取调用图请求
message GetCallGraphRequest {
  string root_function = 1;   // 根函数（可选，为空则返回全图）
  int32 max_depth = 2;        // 最大深度（默认3）
  bool include_external = 3;  // 是否包含外部包调用
}

// 调用图响应
message GetCallGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  int32 total_nodes = 3;
  int32 total_edges = 4;
  string root_node = 5;       // 根节点ID
}

// 图节点
message GraphNode {
  string id = 1;              // 节点唯一ID (function key)
  string label = 2;           // 显示标签 (function name)
  string package = 3;         // 包名
  string full_name = 4;       // 完整函数名
  string signature = 5;       // 函数签名
  string doc = 6;             // 文档
  NodePosition position = 7;   // 位置信息
  NodeMetrics metrics = 8;     // 度量信息
  NodeType type = 9;          // 节点类型
}

// 节点位置信息
message NodePosition {
  string filename = 1;
  int32 start_line = 2;
  int32 end_line = 3;
}

// 节点度量信息
message NodeMetrics {
  int32 caller_count = 1;     // 调用者数量
  int32 callee_count = 2;     // 被调用者数量
  int32 depth_level = 3;      // 调用深度
  float centrality = 4;       // 中心性评分
}

// 节点类型
enum NodeType {
  NORMAL = 0;
  ENTRY_POINT = 1;    // 入口函数
  HOT_SPOT = 2;       // 热点函数
  EXTERNAL = 3;       // 外部函数
}

// 图边
message GraphEdge {
  string id = 1;              // 边唯一ID
  string source = 2;          // 源节点ID
  string target = 3;          // 目标节点ID
  string call_type = 4;       // 调用类型
  int32 call_count = 5;       // 调用次数（动态分析时使用）
  repeated CallSite call_sites = 6; // 调用点信息
}

// 调用点信息
message CallSite {
  string file = 1;
  int32 line = 2;
}

// 获取包依赖关系请求
message GetPackageDependenciesRequest {
}

// 包依赖关系响应
message GetPackageDependenciesResponse {
  repeated PackageNode packages = 1;
  repeated PackageDependency dependencies = 2;
}

// 包节点
message PackageNode {
  string name = 1;
  int32 function_count = 2;
  int32 internal_call_count = 3;
  int32 external_call_count = 4;
  float complexity = 5;
  repeated string sub_packages = 6;  // 子包列表
}

// 包依赖关系
message PackageDependency {
  string source_package = 1;
  string target_package = 2;
  int32 call_count = 3;         // 调用次数
  float dependency_strength = 4; // 依赖强度
  repeated string call_functions = 5; // 涉及的调用函数
}

// 获取热点函数请求
message GetHotFunctionsRequest {
  int32 limit = 1;            // 返回数量限制（默认10）
  string sort_by = 2;         // 排序方式：caller_count, callee_count, importance
}

// 热点函数响应
message GetHotFunctionsResponse {
  repeated DetailedHotFunction functions = 1;
}

// 详细热点函数信息
message DetailedHotFunction {
  string key = 1;
  string name = 2;
  string package = 3;
  string signature = 4;
  string doc = 5;
  NodePosition position = 6;
  int32 caller_count = 7;
  int32 callee_count = 8;
  float importance_score = 9;
  repeated string top_callers = 10;   // 主要调用者
  repeated string top_callees = 11;   // 主要被调用者
}

// 获取函数详细信息请求
message GetFunctionDetailsRequest {
  string function_key = 1;
}

// 函数详细信息响应
message GetFunctionDetailsResponse {
  FunctionDetail function = 1;
  repeated FunctionDetail callers = 2;    // 调用者列表
  repeated FunctionDetail callees = 3;    // 被调用者列表
}

// 函数详细信息
message FunctionDetail {
  string key = 1;
  string name = 2;
  string package = 3;
  string full_name = 4;
  string signature = 5;
  string doc = 6;
  NodePosition position = 7;
  NodeMetrics metrics = 8;
  repeated CallSite call_sites = 9;       // 如果是调用关系，显示调用点
}

// 获取函数调用路径请求
message GetFunctionCallPathsRequest {
  string from_function = 1;   // 起始函数
  string to_function = 2;     // 目标函数
  int32 max_paths = 3;        // 最大路径数（默认5）
  int32 max_depth = 4;        // 最大深度（默认10）
}

// 函数调用路径响应
message GetFunctionCallPathsResponse {
  repeated CallPath paths = 1;
  bool has_more = 2;          // 是否还有更多路径
}

// 调用路径
message CallPath {
  repeated string function_keys = 1;  // 路径上的函数key序列
  int32 path_length = 2;             // 路径长度
  float confidence = 3;              // 路径可信度
}

// 获取Init函数列表请求
message GetInitFunctionsRequest {
  int32 limit = 1;            // 返回数量限制（默认50）
  string package_filter = 2;  // 包名过滤器（可选）
}

// 获取Init函数列表响应
message GetInitFunctionsResponse {
  repeated InitFunction init_functions = 1;
  int32 total_count = 2;      // 总数量
}

// Init函数信息
message InitFunction {
  string key = 1;             // 函数唯一标识
  string name = 2;            // 函数名称（通常是 "init"）
  string package = 3;         // 所属包名
  NodePosition position = 4;   // 位置信息
  string signature = 5;       // 函数签名
  string doc = 6;             // 文档注释
  string full_name = 7;       // 完整函数名
}